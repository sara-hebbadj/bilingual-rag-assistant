name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # the oldest version the project supports
      - name: Install
        run: pip install -e ".[app,dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (offline, no secrets)
        run: pytest -q
