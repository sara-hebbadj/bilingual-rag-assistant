[project]
name = "bilingual-rag-assistant"
version = "0.1.0"
description = "Arabic/English question answering over help pages, with mandatory citations and an honest 'I don't know'."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sara Hebbadj" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "snowballstemmer>=2.2",
]

[project.optional-dependencies]
app = ["gradio>=5.0"]
eval = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.6", "matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Line length is handled by `ruff format`; long prompt strings and messages are allowed.
ignore = ["E501"]
